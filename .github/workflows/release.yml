name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0). Must already exist.'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: ./.github/actions/android-sdk

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: |
            libs
            tools/*.jar
            app/res/raw/cacert.pem
          key: deps-${{ runner.os }}-${{ hashFiles('build.sh') }}

      # Releases should be signed with a stable key, not the generated debug
      # one. Android refuses to update an installed app whose signing key has
      # changed, so shipping a differently-signed build per release would force
      # every user to uninstall first.
      #
      # Set repository secrets to enable this:
      #   KEYSTORE_BASE64    base64 of your .jks  (base64 -w0 keystore.jks)
      #   KEYSTORE_PASSWORD
      #   KEY_ALIAS
      #   KEY_PASSWORD
      # Without them the build still succeeds, using the throwaway debug key,
      # and the step below says so plainly in the release notes.
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ONEAI_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ONEAI_KEYSTORE_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ONEAI_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ONEAI_KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "signed=release" >> "$GITHUB_OUTPUT"
          else
            echo "signed=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret set - signing with a throwaway debug key."
          fi

      - name: Build
        run: ./build.sh

      - name: Verify the artefact
        run: ./tools/verify-apk.sh build/1ai.apk 4

      - name: Checksums
        run: |
          cd build
          sha256sum 1ai.apk > 1ai.apk.sha256
          cat 1ai.apk.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -e
          if [ "$SIGNED" = "debug" ]; then
            SIGNING_NOTE="> **Note:** this build is signed with a throwaway debug key, because no
          > \`KEYSTORE_BASE64\` secret is configured. It installs fine, but you will need to
          > uninstall any previous version before installing this one, and vice versa."
          else
            SIGNING_NOTE="Signed with the project release key."
          fi

          printf '%s\n\n%s\n' \
            "Multi-provider AI chat client for Android 1.6+ (minSdkVersion 4)." \
            "$SIGNING_NOTE" > notes.md

          {
            echo
            echo "### Install"
            echo
            echo '```'
            echo "adb install -r 1ai.apk"
            echo '```'
            echo
            echo "Verified: boots cleanly on Android 4.3 and 5.0 emulators in CI, and the built"
            echo "dex contains no API newer than level 4."
          } >> notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/1ai.apk build/1ai.apk.sha256 --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" build/1ai.apk build/1ai.apk.sha256 \
              --title "$TAG" --notes-file notes.md
          fi
